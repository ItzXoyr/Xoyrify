name: Build mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: gradle_build
        continue-on-error: true
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: List produced files (debug)
        if: always()
        run: |
          echo "--- find build -name '*.jar' ---" > debug.log
          find build -name '*.jar' 2>&1 >> debug.log || true
          echo "--- ls -la build/libs ---" >> debug.log
          ls -la build/libs 2>&1 >> debug.log || true

      - name: Report build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat debug.log > tail.log
          echo "" >> tail.log
          echo "--- last 300 lines of gradle output ---" >> tail.log
          tail -n 300 build-output.log >> tail.log
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Build report - run ${{ github.run_id }}" \
            --body-file tail.log

      - name: Fail job if build failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: xoyrify-mod
          path: build/libs/*.jar
          if-no-files-found: error
